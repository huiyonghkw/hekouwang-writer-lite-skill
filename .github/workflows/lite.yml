name: lite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python version
        run: python3 --version
      - name: Lite source and final package checks
        run: python3 tools/release_check.py --lite
